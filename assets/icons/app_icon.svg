<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="#2E7D32" stroke="#1B5E20" stroke-width="8"/>
  
  <!-- Truck Body -->
  <rect x="120" y="200" width="200" height="80" rx="8" fill="#424242"/>
  
  <!-- Truck Cab -->
  <rect x="320" y="180" width="80" height="100" rx="8" fill="#424242"/>
  
  <!-- Windows -->
  <rect x="330" y="190" width="25" height="30" rx="3" fill="#81C784"/>
  <rect x="365" y="190" width="25" height="30" rx="3" fill="#81C784"/>
  
  <!-- Headlight -->
  <circle cx="405" cy="230" r="8" fill="#FFF176"/>
  
  <!-- Wheels -->
  <circle cx="160" cy="300" r="25" fill="#212121" stroke="#424242" stroke-width="3"/>
  <circle cx="160" cy="300" r="15" fill="#616161"/>
  <circle cx="160" cy="300" r="8" fill="#9E9E9E"/>
  
  <circle cx="280" cy="300" r="25" fill="#212121" stroke="#424242" stroke-width="3"/>
  <circle cx="280" cy="300" r="15" fill="#616161"/>
  <circle cx="280" cy="300" r="8" fill="#9E9E9E"/>
  
  <circle cx="360" cy="300" r="25" fill="#212121" stroke="#424242" stroke-width="3"/>
  <circle cx="360" cy="300" r="15" fill="#616161"/>
  <circle cx="360" cy="300" r="8" fill="#9E9E9E"/>
  
  <!-- Route Path -->
  <path d="M 80 150 Q 150 120 220 140 T 380 130" stroke="#81C784" stroke-width="6" fill="none" stroke-dasharray="10,5"/>
  
  <!-- Location Pins -->
  <g transform="translate(80,130)">
    <path d="M 0 0 L -8 -20 Q -8 -28 0 -28 Q 8 -28 8 -20 L 0 0 Z" fill="#FF5722"/>
    <circle cx="0" cy="-20" r="4" fill="#FFFFFF"/>
  </g>
  
  <g transform="translate(380,110)">
    <path d="M 0 0 L -8 -20 Q -8 -28 0 -28 Q 8 -28 8 -20 L 0 0 Z" fill="#FF5722"/>
    <circle cx="0" cy="-20" r="4" fill="#FFFFFF"/>
  </g>
  
  <!-- App Title -->
  <text x="256" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#FFFFFF">VEHICLE</text>
  <text x="256" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#C8E6C9">TRACKER</text>
</svg>