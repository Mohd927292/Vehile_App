<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle with Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="truckGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#616161;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#424242;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGradient)" stroke="#1B5E20" stroke-width="8"/>
  
  <!-- Truck Body -->
  <rect x="140" y="220" width="180" height="70" rx="8" fill="url(#truckGradient)"/>
  
  <!-- Truck Cab -->
  <rect x="320" y="200" width="70" height="90" rx="8" fill="url(#truckGradient)"/>
  
  <!-- Windows -->
  <rect x="330" y="210" width="20" height="25" rx="3" fill="#E8F5E8"/>
  <rect x="360" y="210" width="20" height="25" rx="3" fill="#E8F5E8"/>
  
  <!-- Headlight -->
  <circle cx="395" cy="245" r="8" fill="#FFF176"/>
  
  <!-- Front Grille -->
  <rect x="385" y="250" width="10" height="20" rx="2" fill="#757575"/>
  
  <!-- Wheels -->
  <circle cx="180" cy="310" r="28" fill="#212121" stroke="#424242" stroke-width="3"/>
  <circle cx="180" cy="310" r="18" fill="#616161"/>
  <circle cx="180" cy="310" r="10" fill="#9E9E9E"/>
  <circle cx="180" cy="310" r="4" fill="#E0E0E0"/>
  
  <circle cx="280" cy="310" r="28" fill="#212121" stroke="#424242" stroke-width="3"/>
  <circle cx="280" cy="310" r="18" fill="#616161"/>
  <circle cx="280" cy="310" r="10" fill="#9E9E9E"/>
  <circle cx="280" cy="310" r="4" fill="#E0E0E0"/>
  
  <circle cx="350" cy="310" r="28" fill="#212121" stroke="#424242" stroke-width="3"/>
  <circle cx="350" cy="310" r="18" fill="#616161"/>
  <circle cx="350" cy="310" r="10" fill="#9E9E9E"/>
  <circle cx="350" cy="310" r="4" fill="#E0E0E0"/>
  
  <!-- Route Path -->
  <path d="M 100 180 Q 170 150 240 170 T 400 160" stroke="#81C784" stroke-width="8" fill="none" stroke-dasharray="15,8"/>
  
  <!-- Location Pins -->
  <g transform="translate(100,160)">
    <path d="M 0 0 L -10 -25 Q -10 -35 0 -35 Q 10 -35 10 -25 L 0 0 Z" fill="#FF5722"/>
    <circle cx="0" cy="-25" r="6" fill="#FFFFFF"/>
  </g>
  
  <g transform="translate(400,140)">
    <path d="M 0 0 L -10 -25 Q -10 -35 0 -35 Q 10 -35 10 -25 L 0 0 Z" fill="#FF5722"/>
    <circle cx="0" cy="-25" r="6" fill="#FFFFFF"/>
  </g>
  
  <!-- Speed Lines for Motion -->
  <g opacity="0.6">
    <line x1="120" y1="200" x2="100" y2="195" stroke="#81C784" stroke-width="3" stroke-linecap="round"/>
    <line x1="120" y1="220" x2="95" y2="215" stroke="#81C784" stroke-width="3" stroke-linecap="round"/>
    <line x1="120" y1="240" x2="90" y2="235" stroke="#81C784" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>